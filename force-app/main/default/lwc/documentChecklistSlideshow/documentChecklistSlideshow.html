<template>
    <lightning-card title="Checklist Documents" icon-name="doctype:attachment">

        <template if:true={isLoading}>
            <lightning-spinner size="medium"></lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_small">
                {error}
            </div>
        </template>

        <template if:true={hasDocuments}>
            <div class="viewer" onclick={previewFile}>

                <template if:true={isImage}>
                    <img src={currentDocument.downloadUrl} class="image"/>
                </template>

                <template if:true={isPdf}>
                    <iframe src={currentDocument.downloadUrl} class="pdf"></iframe>
                </template>

                <template if:false={isImage}>
                    <template if:false={isPdf}>
                        <div class="placeholder">
                            <lightning-icon
                                icon-name={currentDocument.iconName}
                                size="large">
                            </lightning-icon>
                            <p>{currentDocument.title}</p>
                            <p class="meta">
                                {currentDocument.fileType} • {currentDocument.fileSize}
                            </p>
                        </div>
                    </template>
                </template>

            </div>

            <div class="controls">
                <lightning-button-icon icon-name="utility:chevronleft"
                    onclick={previous}></lightning-button-icon>

                <lightning-button-icon icon-name={playPauseIcon}
                    onclick={togglePlayPause}></lightning-button-icon>

                <lightning-button-icon icon-name="utility:chevronright"
                    onclick={next}></lightning-button-icon>

                <span>{currentPosition}</span>

                <lightning-button-icon icon-name="utility:download"
                    onclick={downloadFile}></lightning-button-icon>
            </div>

            <div class="dots">
                <template for:each={documents} for:item="doc" for:index="index">
                    <span key={doc.contentDocumentId}
                          class={doc.dotClass}
                          data-index={index}
                          onclick={dotClick}></span>
                </template>
            </div>
        </template>

        <template if:false={hasDocuments}>
            <p class="slds-align_absolute-center slds-p-around_medium">
                No files uploaded
            </p>
        </template>

    </lightning-card>
</template>
