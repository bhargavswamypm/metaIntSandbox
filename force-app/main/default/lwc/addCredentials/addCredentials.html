<template>
    <lightning-card title="Credentials" icon-name="doctype:attachment">
        <div class="slds-p-around_medium">
            <!-- Upload Section -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Upload New Credential</h3>
                
                <lightning-combobox
                    name="credentialType"
                    label="Credential Type"
                    value={credentialType}
                    placeholder="Select credential type"
                    options={credentialOptions}
                    onchange={handleCredentialTypeChange}
                    required
                ></lightning-combobox>

                <div class="slds-m-top_small">
                    <lightning-file-upload
                        label="Upload File"
                        name="fileUploader"
                        accept={acceptedFormats}
                        record-id={recordId}
                        disabled={isUploadDisabled}
                        onuploadfinished={handleUploadFinished}
                        multiple
                    ></lightning-file-upload>
                </div>

                <template if:true={isUploadDisabled}>
                    <div class="slds-text-color_error slds-m-top_small">
                        <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                        Please select a credential type before uploading
                    </div>
                </template>
            </div>

            <!-- Files List Section -->
            <template if:true={hasFiles}>
                <h3 class="slds-text-heading_small slds-m-bottom_small">Uploaded Credentials</h3>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">
                                <div class="slds-truncate" title="File Name">File Name</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Credential Type">Credential Type</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="File Type">File Type</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Uploaded Date">Uploaded Date</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Actions">Actions</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={uploadedFiles} for:item="file">
                            <tr key={file.Id} class="slds-hint-parent">
                                <td data-label="File Name">
                                    <div class="slds-truncate" title={file.Title}>{file.Title}</div>
                                </td>
                                <td data-label="Credential Type">
                                    <lightning-badge label={file.CredentialType}></lightning-badge>
                                </td>
                                <td data-label="File Type">
                                    <div class="slds-truncate">{file.FileExtension}</div>
                                </td>
                                <td data-label="Uploaded Date">
                                    <lightning-formatted-date-time value={file.CreatedDate}></lightning-formatted-date-time>
                                </td>
                                <td data-label="Actions">
                                    <lightning-button-group>
                                        <lightning-button 
                                            label="View" 
                                            data-id={file.Id}
                                            onclick={handleViewFile}
                                            variant="neutral"
                                        ></lightning-button>
                                        <lightning-button 
                                            label="Delete" 
                                            data-id={file.Id}
                                            onclick={handleDelete}
                                            variant="destructive"
                                        ></lightning-button>
                                    </lightning-button-group>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasFiles}>
                <div class="slds-text-align_center slds-m-vertical_medium">
                    <lightning-icon icon-name="doctype:attachment" size="large"></lightning-icon>
                    <p class="slds-text-body_regular slds-m-top_small">No credentials uploaded yet</p>
                </div>
            </template>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
